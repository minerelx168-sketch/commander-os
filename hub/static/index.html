<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👑 Commander Hub — CEO Command</title>
<style>
  :root {
    /* Jarvis / arc-reactor palette: deep blue-black + glowing cyan */
    --bg: #010409; --panel: #050b16; --panel2: #081120; --border: #0e2a45;
    --text: #cfeaff; --dim: #4f7ea8; --accent: #00d4ff; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --purple: #35c9ff; --purple2: #0a84c0;
    --glow: 0 0 14px rgba(0, 212, 255, .35);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 700px at 70% -10%, #06182e 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh;
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px; display: flex;
  }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  /* ===== sidebar ===== */
  aside {
    width: 236px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
    background: linear-gradient(180deg, #04101f, #02060d);
    border-right: 1px solid var(--border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 5px; overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo .mark {
    width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 50%, #0c3a5e, #02070f 70%);
    border: 1px solid var(--accent); font-size: 18px;
    box-shadow: var(--glow), inset 0 0 12px rgba(0, 212, 255, .3);
    animation: reactor 3.2s ease-in-out infinite;
  }
  @keyframes reactor { 50% { box-shadow: 0 0 24px rgba(0,212,255,.6), inset 0 0 16px rgba(0,212,255,.45); } }
  .logo .t1 { font-weight: 700; font-size: 14px; text-shadow: 0 0 10px rgba(0,212,255,.4); }
  .logo .t2 { color: var(--dim); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; font-family: "SF Mono", monospace; }
  nav button {
    display: flex; align-items: center; gap: 11px; width: 100%; padding: 14px 15px;
    border-radius: 10px; color: var(--dim); font-size: 14px; background: transparent;
    border: 1px solid transparent; cursor: pointer; font-family: inherit; text-align: left; font-weight: 500;
    transition: all .15s;
  }
  nav button:hover { color: var(--text); background: var(--panel2); border-color: var(--border); }
  nav button.active {
    color: var(--accent); background: linear-gradient(90deg, rgba(0,212,255,.12), rgba(0,212,255,.03));
    border-color: var(--accent); font-weight: 700; box-shadow: var(--glow), inset 0 0 18px rgba(0,212,255,.08);
    text-shadow: 0 0 8px rgba(0,212,255,.5);
  }
  nav .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }
  nav .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .side-h { margin: 16px 4px 8px; color: var(--dim); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; font-family: "SF Mono", monospace; }
  .side-foot { margin-top: auto; padding-top: 14px; color: var(--dim); font-size: 10px; text-align: center; }

  /* ===== main ===== */
  main { flex: 1; min-width: 0; padding: 20px 26px; height: 100vh; overflow-y: auto; }
  .view { display: none; }
  .view.active { display: block; }
  h1.page { font-size: 13px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; font-family: "SF Mono", monospace; text-shadow: 0 0 10px rgba(0,212,255,.35); }
  .panel {
    background: linear-gradient(180deg, rgba(8,17,32,.85), rgba(4,10,20,.9));
    border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    box-shadow: inset 0 0 30px rgba(0, 212, 255, .03);
  }
  .panel h2 { font-size: 10px; letter-spacing: 2.5px; color: var(--dim); margin-bottom: 12px; text-transform: uppercase; font-family: "SF Mono", monospace; }
  .empty { color: var(--dim); font-style: italic; }

  /* ===== Command Overall: ask box + tree ===== */
  .askbox { display: flex; gap: 12px; }
  .askbox textarea {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 14px; padding: 15px 18px; border-radius: 12px;
    outline: none; resize: none; min-height: 54px; max-height: 130px; line-height: 1.4;
  }
  .askbox textarea:focus { border-color: var(--accent); box-shadow: var(--glow); }
  .askbox button {
    background: linear-gradient(135deg, #0a84c0, #005f8f); color: #eaffff; border: 1px solid var(--accent);
    font-family: "SF Mono", monospace; font-size: 13px; letter-spacing: 2.5px; font-weight: 700;
    padding: 15px 36px; border-radius: 12px; cursor: pointer; align-self: stretch;
    box-shadow: var(--glow); text-shadow: 0 0 8px rgba(0,212,255,.6); transition: all .15s;
  }
  .askbox button:hover { box-shadow: 0 0 24px rgba(0,212,255,.55); }
  .askbox button:disabled { opacity: .5; cursor: wait; }

  /* tree diagram */
  .tree { margin-top: 18px; display: none; }
  .tree.show { display: block; }
  .tree-root {
    max-width: 620px; margin: 0 auto; text-align: center;
    background: radial-gradient(circle at 50% 0%, #0c3a5e, #04101f 75%);
    border: 1px solid var(--accent); border-radius: 14px; padding: 14px 20px;
    box-shadow: var(--glow), inset 0 0 22px rgba(0,212,255,.1);
  }
  .tree-root .who { color: var(--accent); font-size: 10px; letter-spacing: 2px; font-family: "SF Mono", monospace; text-shadow: 0 0 8px rgba(0,212,255,.6); }
  .tree-root .q { margin-top: 6px; font-size: 14px; }
  .tree-trunk { width: 2px; height: 26px; margin: 0 auto; background: var(--accent); box-shadow: var(--glow); }
  .tree-rail { height: 2px; background: var(--accent); margin: 0 11%; position: relative; box-shadow: var(--glow); }
  .tree-branches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .tree-branch { display: flex; flex-direction: column; align-items: center; }
  .tree-branch .drop { width: 2px; height: 20px; background: var(--accent); box-shadow: var(--glow); }
  .consult-card {
    width: 100%; background: var(--panel2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; font-size: 12px; line-height: 1.55;
    transition: border-color .2s;
  }
  .consult-card:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .consult-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .consult-card .ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #0c2237; border: 1px solid var(--border); font-size: 14px; }
  .consult-card .nm { font-weight: 700; font-size: 13px; }
  .consult-card .pv { margin-left: auto; color: var(--dim); font-size: 9px; font-family: "SF Mono", monospace; }
  .consult-card .body { white-space: pre-wrap; color: var(--text); max-height: 340px; overflow-y: auto; }
  .consult-card.err { border-color: rgba(248,113,113,.45); }
  .hist-item { padding: 11px 0; border-bottom: 1px dashed #0e2a4580; cursor: pointer; }
  .hist-item:hover .q { color: var(--accent); text-shadow: 0 0 8px rgba(0,212,255,.4); }
  .hist-item .q { font-size: 12.5px; }
  .hist-item .at { color: var(--dim); font-size: 10px; font-family: "SF Mono", monospace; }

  /* ===== dept task pages ===== */
  .dept-hero { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .dept-hero .ic {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 24px;
    background: radial-gradient(circle at 50% 50%, #0c3a5e, #02070f 75%); border: 1px solid var(--accent);
    box-shadow: var(--glow), inset 0 0 10px rgba(0,212,255,.25);
  }
  .dept-hero .nm { font-size: 18px; font-weight: 700; text-shadow: 0 0 10px rgba(0,212,255,.35); }
  .dept-hero .rl { color: var(--dim); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-family: "SF Mono", monospace; }
  .dept-hero .badges { margin-left: auto; display: flex; gap: 8px; }
  .badge { font-size: 10px; letter-spacing: .5px; padding: 6px 14px; border-radius: 10px; font-family: "SF Mono", monospace; }
  .b-on { background: rgba(52,211,153,.12); color: var(--green); border: 1px solid rgba(52,211,153,.35); }
  .b-off { background: rgba(79,126,168,.12); color: var(--dim); border: 1px solid var(--border); }
  .b-ai { background: rgba(0,212,255,.1); color: var(--accent); border: 1px solid rgba(0,212,255,.35); }
  .task-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .task-item .cmd { font-weight: 600; margin-bottom: 6px; }
  .task-item .res { color: var(--text); font-size: 12px; white-space: pre-wrap; line-height: 1.55; max-height: 260px; overflow-y: auto; }
  .task-item .meta { color: var(--dim); font-size: 9.5px; margin-top: 6px; font-family: "SF Mono", monospace; }
  .lesson { color: var(--dim); font-size: 11.5px; padding: 3px 0 3px 12px; border-left: 2px solid var(--accent); margin-bottom: 5px; }

  /* ===== agents page ===== */
  .agent-row {
    display: flex; align-items: center; gap: 14px; background: var(--panel2);
    border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; margin-bottom: 10px;
    transition: border-color .2s;
  }
  .agent-row:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .agent-row .ic {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
    background: radial-gradient(circle at 50% 50%, #0c3a5e, #02070f 75%); border: 1px solid var(--border);
  }
  .agent-row .nm { font-weight: 700; font-size: 15px; }
  .agent-row .rl { color: var(--dim); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; font-family: "SF Mono", monospace; }
  .agent-row select {
    margin-left: auto; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 14px; padding: 13px 16px; border-radius: 10px; outline: none; cursor: pointer; min-width: 250px;
  }
  .agent-row select:focus { border-color: var(--accent); box-shadow: var(--glow); }
  .ready-tag { font-size: 10px; padding: 6px 12px; border-radius: 9px; font-family: "SF Mono", monospace; }

  @media (max-width: 1100px) { .tree-branches { grid-template-columns: repeat(2, 1fr); } .tree-rail { display: none; } }
</style>
</head>
<body>

<aside>
  <div class="logo">
    <div class="mark">👑</div>
    <div>
      <div class="t1">Commander Hub</div>
      <div class="t2">You are the CEO</div>
    </div>
  </div>
  <nav id="nav">
    <button data-view="overall" class="active">⌘ Command Overall</button>
    <div class="side-h">Departments</div>
    <button data-view="cmo">📣 CMO <span class="dot" id="dot-cmo"></span></button>
    <button data-view="cfo">💰 CFO <span class="dot" id="dot-cfo"></span></button>
    <button data-view="coo">🛰 COO <span class="dot" id="dot-coo"></span></button>
    <button data-view="datalyst">📊 Datalyst <span class="dot" id="dot-datalyst"></span></button>
    <div class="side-h">System</div>
    <button data-view="agents">🤖 Agents</button>
  </nav>
  <div class="side-foot mono" id="conn">connecting…</div>
</aside>

<main>

<!-- ===== PAGE 1: COMMAND OVERALL ===== -->
<section class="view active" id="view-overall">
  <h1 class="page">Command Overall — ถามบอร์ดที่ปรึกษา</h1>
  <div class="panel">
    <div class="askbox">
      <textarea id="ask-text" rows="1" placeholder="พิมพ์คำถามถึงบอร์ด… ทั้ง 4 C-level จะให้ความเห็นความเสี่ยง/ผลดีในมุมที่ตัวเองถนัด"></textarea>
      <button id="ask-btn" onclick="askBoard()">CONSULT</button>
    </div>
    <div class="tree" id="tree">
      <div class="tree-root">
        <span class="who">👑 CEO — YOU</span>
        <div class="q" id="tree-q"></div>
      </div>
      <div class="tree-trunk"></div>
      <div class="tree-rail"></div>
      <div class="tree-branches" id="tree-branches"></div>
    </div>
  </div>
  <div class="panel">
    <h2>ประวัติการปรึกษา</h2>
    <div id="consult-hist"><div class="empty">ยังไม่มี</div></div>
  </div>
</section>

<!-- ===== PAGES 2-5: DEPT TASK PAGES (rendered from one template) ===== -->
<section class="view" id="view-cmo"></section>
<section class="view" id="view-cfo"></section>
<section class="view" id="view-coo"></section>
<section class="view" id="view-datalyst"></section>

<!-- ===== PAGE 6: AGENTS ===== -->
<section class="view" id="view-agents">
  <h1 class="page">Agents — เลือก AI ให้แต่ละ C-level</h1>
  <div class="panel">
    <h2>ผูก AI provider เข้ากับแผนก (Claude / Gemini / Manus)</h2>
    <div id="agent-rows"><div class="empty">กำลังโหลด…</div></div>
  </div>
</section>

</main>

<script>
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
let STATE = { depts: [], providers: [], consults: [] };
const DEPT_KEYS = ['cmo', 'cfo', 'coo', 'datalyst'];

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-' + b.dataset.view).classList.add('active');
  if (DEPT_KEYS.includes(b.dataset.view)) renderDeptPage(b.dataset.view);
}));

// ---------- state ----------
async function loadState() {
  try {
    STATE = await (await fetch('/api/state')).json();
    document.getElementById('conn').textContent = '🟢 hub live';
    for (const d of STATE.depts)
      document.getElementById('dot-' + d.key)?.classList.toggle('on', d.online);
    renderHistory(STATE.consults);
    renderAgents();
  } catch (e) { document.getElementById('conn').textContent = '🔴 hub offline'; }
}
loadState();
setInterval(loadState, 15000);

// ---------- page 1: consult tree ----------
function consultCard(dept, a) {
  const d = STATE.depts.find(x => x.key === dept) || { icon: '🤖', name: dept };
  return `
    <div class="tree-branch">
      <div class="drop"></div>
      <div class="consult-card ${a.ok ? '' : 'err'}">
        <div class="head">
          <div class="ic">${d.icon}</div>
          <div><div class="nm">${d.name}</div></div>
          <span class="pv">${esc(a.provider)}</span>
        </div>
        <div class="body">${esc(a.text)}</div>
      </div>
    </div>`;
}

function showTree(question, answers) {
  document.getElementById('tree-q').textContent = question;
  document.getElementById('tree-branches').innerHTML =
    DEPT_KEYS.map(k => answers[k] ? consultCard(k, answers[k]) : '').join('');
  document.getElementById('tree').classList.add('show');
}

async function askBoard() {
  const ta = document.getElementById('ask-text');
  const btn = document.getElementById('ask-btn');
  const q = ta.value.trim();
  if (!q) return;
  btn.disabled = true; btn.textContent = 'CONSULTING…';
  document.getElementById('tree-q').textContent = q;
  document.getElementById('tree-branches').innerHTML =
    DEPT_KEYS.map(() => '<div class="tree-branch"><div class="drop"></div><div class="consult-card"><div class="empty">กำลังคิด…</div></div></div>').join('');
  document.getElementById('tree').classList.add('show');
  try {
    const r = await fetch('/api/consult', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const j = await r.json();
    showTree(j.question, j.answers);
    ta.value = '';
    loadState();
  } catch (e) {
    document.getElementById('tree-branches').innerHTML = `<div class="empty">⚠️ ${esc(String(e))}</div>`;
  }
  btn.disabled = false; btn.textContent = 'CONSULT';
}
document.getElementById('ask-text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); askBoard(); }
});

function renderHistory(consults) {
  document.getElementById('consult-hist').innerHTML = (consults || []).map(c => `
    <div class="hist-item" onclick='showTree(${JSON.stringify(c.question)}, ${JSON.stringify(c.answers)})'>
      <div class="q">${esc(c.question)}</div>
      <div class="at">${(c.at || '').substring(0, 16).replace('T', ' ')}</div>
    </div>`).join('') || '<div class="empty">ยังไม่มี</div>';
}

// ---------- pages 2-5: dept task pages ----------
function renderDeptPage(key) {
  const d = STATE.depts.find(x => x.key === key) || { icon: '🤖', name: key.toUpperCase(), role: '', provider: 'mock', online: false };
  const view = document.getElementById('view-' + key);
  view.innerHTML = `
    <h1 class="page">${d.name} — สั่งงานจริง</h1>
    <div class="dept-hero">
      <div class="ic">${d.icon}</div>
      <div>
        <div class="nm">${d.name}</div>
        <div class="rl">${esc(d.role)}</div>
      </div>
      <div class="badges">
        <span class="badge ${d.online ? 'b-on' : 'b-off'}">${d.online ? '● service online' : '○ service offline'}</span>
        <span class="badge b-ai">AI: ${esc(d.provider)}</span>
      </div>
    </div>
    <div class="panel">
      <div class="askbox">
        <textarea id="task-text-${key}" rows="1" placeholder="มอบหมายงานให้ ${d.name} ลงมือทำจริง… (Enter เพื่อส่ง)"></textarea>
        <button id="task-btn-${key}" onclick="runTask('${key}')">ASSIGN</button>
      </div>
    </div>
    <div class="panel">
      <h2>🧠 LLM Learning — บทเรียนสะสมของ ${d.name}</h2>
      <div id="lessons-${key}"><div class="empty">ยังไม่มี</div></div>
    </div>
    <div class="panel">
      <h2>ประวัติงาน</h2>
      <div id="tasks-${key}"><div class="empty">กำลังโหลด…</div></div>
    </div>`;
  document.getElementById('task-text-' + key).addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runTask(key); }
  });
  loadDeptTasks(key);
}

async function loadDeptTasks(key) {
  try {
    const j = await (await fetch(`/api/dept/${key}/tasks`)).json();
    document.getElementById('tasks-' + key).innerHTML = (j.tasks || []).map(t => `
      <div class="task-item">
        <div class="cmd">#${t.id} · ${esc(t.command)}</div>
        <div class="res">${esc(t.result)}</div>
        <div class="meta">${esc(t.provider)} · ${(t.at || '').substring(0, 16).replace('T', ' ')}</div>
      </div>`).join('') || '<div class="empty">ยังไม่มีงาน</div>';
    document.getElementById('lessons-' + key).innerHTML = (j.lessons || []).map(l =>
      `<div class="lesson">${esc(l)}</div>`).join('') || '<div class="empty">ยังไม่มี — จะสะสมเองเมื่อทำงาน</div>';
  } catch (e) { /* keep */ }
}

async function runTask(key) {
  const ta = document.getElementById('task-text-' + key);
  const btn = document.getElementById('task-btn-' + key);
  const cmd = ta.value.trim();
  if (!cmd) return;
  btn.disabled = true; btn.textContent = 'WORKING…';
  try {
    await fetch(`/api/dept/${key}/task`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command: cmd})
    });
    ta.value = '';
    await loadDeptTasks(key);
  } catch (e) { alert('⚠️ ' + e); }
  btn.disabled = false; btn.textContent = 'ASSIGN';
}

// ---------- page 6: agents ----------
function renderAgents() {
  document.getElementById('agent-rows').innerHTML = STATE.depts.map(d => `
    <div class="agent-row">
      <div class="ic">${d.icon}</div>
      <div>
        <div class="nm">${d.name}</div>
        <div class="rl">${esc(d.role)}</div>
      </div>
      <span class="ready-tag ${d.provider_ready ? 'b-on' : 'b-off'}">${d.provider_ready ? 'key ready' : 'no key'}</span>
      <select onchange="setProvider('${d.key}', this.value)">
        ${STATE.providers.map(p => `
          <option value="${p.key}" ${p.key === d.provider ? 'selected' : ''}>
            ${esc(p.label)} — ${esc(p.model)}${p.ready ? '' : ' (no key)'}
          </option>`).join('')}
      </select>
    </div>`).join('') || '<div class="empty">กำลังโหลด…</div>';
}

async function setProvider(dept, provider) {
  await fetch(`/api/dept/${dept}/provider`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({provider})
  });
  loadState();
}
</script>
</body>
</html>
