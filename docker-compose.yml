services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: commander
      POSTGRES_PASSWORD: commander_pw
      POSTGRES_DB: commander_os
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander -d commander_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://commander:commander_pw@postgres:5432/commander_os
      META_AGENT_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
