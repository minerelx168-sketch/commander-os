<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Commander OS</title>
<style>
  :root {
    --bg: #04060c; --panel: #0a0f1a; --panel2: #0d1524; --border: #182338;
    --text: #d7e1f3; --dim: #5f7191; --accent: #38bdf8; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --purple: #a78bfa; --purple2: #7c5cd6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: -apple-system, "Segoe UI", sans-serif; font-size: 13px;
    display: flex;
  }
  .mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }

  /* ============ SIDEBAR ============ */
  aside {
    width: 224px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
    background: linear-gradient(180deg, #090f1c, #05080f);
    border-right: 1px solid var(--border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo .mark {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #2a2555, #0a0e17);
    border: 1px solid var(--purple2); font-size: 17px;
  }
  .logo .t1 { font-weight: 700; font-size: 14px; }
  .logo .t2 { color: var(--dim); font-size: 8.5px; letter-spacing: 2px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
    border-radius: 9px; color: var(--dim); font-size: 12.5px; letter-spacing: .3px;
    background: transparent; border: 1px solid transparent; cursor: pointer;
    font-family: inherit; text-align: left; font-weight: 500;
  }
  nav button:hover { color: var(--text); background: var(--panel2); }
  nav button.active { color: var(--text); background: var(--panel2); border-color: var(--border); font-weight: 700; }
  nav button .n {
    margin-left: auto; background: rgba(251,191,36,.15); color: var(--amber);
    font-size: 10px; padding: 1px 7px; border-radius: 8px;
  }
  .side-h { margin: 18px 4px 8px; color: var(--dim); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .side-agent {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin-bottom: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 9px;
    cursor: pointer; transition: border-color .15s;
  }
  .side-agent:hover, .side-agent.sel { border-color: var(--purple2); }
  .side-agent .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; background: #1a2440; }
  .side-agent .nm { font-size: 12px; font-weight: 700; }
  .side-agent .rl { color: var(--dim); font-size: 8.5px; letter-spacing: 1px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .pill { margin-left: auto; font-size: 9px; letter-spacing: .5px; padding: 2px 8px; border-radius: 9px; white-space: nowrap; font-family: "SF Mono", ui-monospace, monospace; }
  .pill::before { content: "● "; }
  .p-WORKING { background: rgba(52,211,153,.12); color: var(--green); }
  .p-WAITING { background: rgba(251,191,36,.12); color: var(--amber); }
  .p-IDLE { background: rgba(95,113,145,.12); color: var(--dim); }
  .side-foot { margin-top: auto; padding-top: 14px; }
  #killbtn {
    width: 100%; background: transparent; color: var(--red); border: 1px solid var(--red);
    padding: 8px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 11px;
  }
  #killbtn.engaged { background: var(--red); color: #000; font-weight: bold; }
  #conn { display: block; text-align: center; color: var(--dim); font-size: 10px; margin-top: 8px; }

  /* ============ MAIN ============ */
  main { flex: 1; min-width: 0; padding: 20px 26px; display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
  .view { display: none; }
  .view.active { display: block; }
  #view-chat.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  h1.page { font-size: 12px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; margin-bottom: 16px; font-family: "SF Mono", ui-monospace, monospace; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .panel h2 { font-size: 10px; letter-spacing: 2.5px; color: var(--dim); margin-bottom: 12px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .empty { color: var(--dim); font-style: italic; }

  /* ---- Chat: agent card strip ---- */
  .agent-strip { display: flex; gap: 12px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 2px; }
  .agent-card {
    flex: 1; min-width: 150px; background: linear-gradient(180deg, #0c1322, #090e19);
    border: 1px solid var(--border); border-radius: 13px; padding: 13px 15px 11px;
    cursor: pointer; position: relative; transition: border-color .15s;
  }
  .agent-card:hover { border-color: #2a3a5c; }
  .agent-card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .agent-card .ic {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    font-size: 16px; background: #1a2440; border: 1px solid #243252;
  }
  .agent-card .nm { font-size: 15px; font-weight: 700; }
  .agent-card .rl { color: var(--dim); font-size: 8.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 3px; font-family: "SF Mono", ui-monospace, monospace; }
  .agent-card.sel::after {
    content: ""; position: absolute; left: 15px; right: 55%; bottom: 6px; height: 3px;
    border-radius: 2px; background: var(--purple);
  }

  /* ---- Chat window ---- */
  .chat-wrap {
    flex: 1; display: flex; flex-direction: column; min-height: 0;
    background: linear-gradient(180deg, #0a101d, #070b14);
    border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  }
  .chat-head {
    display: flex; align-items: center; gap: 12px; padding: 13px 18px;
    background: rgba(13,21,36,.6); border-bottom: 1px solid var(--border);
  }
  .chat-head .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 16px; background: #1a2440; }
  .chat-head .nm { font-size: 15px; font-weight: 700; }
  .chat-head .ch { color: var(--dim); font-size: 10px; margin-top: 2px; font-family: "SF Mono", ui-monospace, monospace; }
  .chat-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #wake {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 13px;
  }
  #wake.on { border-color: var(--green); color: var(--green); }
  #chat-feed { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 72%; padding: 10px 15px; border-radius: 15px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.me {
    align-self: flex-end; color: #fff;
    background: linear-gradient(135deg, #6d5bd0, #4c3f96);
    border-bottom-right-radius: 5px;
  }
  .msg.bot {
    align-self: flex-start; background: var(--panel2);
    border: 1px solid var(--border); border-bottom-left-radius: 5px;
  }
  .msg .who { display: block; color: var(--purple); font-size: 10px; letter-spacing: 1px; margin-bottom: 4px; font-family: "SF Mono", ui-monospace, monospace; }
  .msg .ts { display: block; color: rgba(215,225,243,.4); font-size: 9px; margin-top: 5px; text-align: right; font-family: "SF Mono", ui-monospace, monospace; }
  .msg .brief-link { color: var(--accent); font-size: 11px; cursor: pointer; text-decoration: underline; display: inline-block; margin-top: 6px; }
  .msg.approval { border-left: 3px solid var(--amber); }
  .msg.approval button {
    font-family: inherit; font-size: 11px; padding: 5px 14px; border-radius: 7px;
    cursor: pointer; margin: 8px 6px 0 0; border: 1px solid; background: transparent;
  }
  .btn-ok { color: var(--green); border-color: var(--green); }
  .btn-no { color: var(--red); border-color: var(--red); }
  .typing { align-self: flex-start; display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 15px; padding: 10px 16px; color: var(--dim); font-size: 12px; }
  .typing .dots { display: inline-flex; gap: 3px; }
  .typing .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--purple); animation: blink 1.2s infinite; }
  .typing .dots i:nth-child(2) { animation-delay: .2s; }
  .typing .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* ---- Chat input bar ---- */
  .chat-input { display: flex; align-items: flex-end; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--border); background: rgba(13,21,36,.5); }
  #chat-text {
    flex: 1; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 13px; padding: 12px 16px; border-radius: 22px;
    outline: none; resize: none; max-height: 110px; line-height: 1.4;
  }
  #chat-text:focus { border-color: var(--purple2); }
  #orb {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer; font-size: 15px; flex-shrink: 0;
    border: 2px solid var(--border); color: var(--text); transition: all .2s;
    background: radial-gradient(circle at 35% 35%, #1c2742, #0a0e19);
  }
  #orb.rec { border-color: var(--red); color: var(--red); animation: pulse 1s infinite; box-shadow: 0 0 18px rgba(248,113,113,.5); }
  #orb.busy { border-color: var(--amber); color: var(--amber); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #send-btn {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    font-family: "SF Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: 2px;
    padding: 12px 24px; border-radius: 22px; cursor: pointer; flex-shrink: 0;
  }
  #send-btn:hover { border-color: var(--purple2); color: #fff; }
  #voice-status { color: var(--dim); font-size: 10px; padding: 4px 20px 0; min-height: 15px; text-align: right; font-family: "SF Mono", ui-monospace, monospace; }

  /* ---- Projects ---- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat .lbl { color: var(--dim); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .stat .num { font-size: 22px; margin-top: 5px; }
  .n-ok { color: var(--green); } .n-warn { color: var(--amber); } .n-err { color: var(--red); }
  .proj { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
  .proj-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; }
  .proj-head:hover { background: var(--panel2); }
  .proj-head .id { color: var(--dim); font-size: 11px; font-family: "SF Mono", ui-monospace, monospace; }
  .proj-head .title { flex: 1; font-size: 13px; }
  .proj-bar { width: 130px; height: 7px; border-radius: 4px; background: #131d31; overflow: hidden; }
  .proj-bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s; }
  .st-done { color: var(--green); } .st-waiting_approval { color: var(--amber); }
  .st-in_progress { color: var(--accent); } .st-failed { color: var(--red); } .st-pending { color: var(--dim); }
  .proj-status { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; width: 110px; text-align: right; font-family: "SF Mono", ui-monospace, monospace; }
  .proj-body { display: none; border-top: 1px solid var(--border); padding: 16px 18px; }
  .proj.open .proj-body { display: block; }
  .proj-sec { margin-bottom: 14px; }
  .proj-sec h3 { font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; font-family: "SF Mono", ui-monospace, monospace; }
  .dept-block { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .dept-block .who { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
  .dept-ev { color: var(--dim); font-size: 11px; padding: 2px 0 2px 12px; border-left: 1px dashed var(--border); margin-left: 3px; }
  .dept-ev b { color: var(--text); font-weight: normal; }
  .board-msg { background: var(--panel2); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; margin-bottom: 7px; font-size: 12px; }
  .board-msg .who { color: var(--accent); font-size: 10px; letter-spacing: 1px; display: block; margin-bottom: 4px; font-family: "SF Mono", ui-monospace, monospace; }
  .board-msg.is-ceo { border-left: 3px solid var(--purple); }
  .board-msg.is-ceo .who { color: var(--purple); }
  .report-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 12px; white-space: pre-wrap; line-height: 1.55; max-height: 300px; overflow-y: auto; }
  .brief-link { color: var(--accent); font-size: 11px; cursor: pointer; text-decoration: underline; }

  /* ---- Departments ---- */
  .day-h { color: var(--accent); font-size: 11px; letter-spacing: 2px; margin: 12px 0 6px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .day-h:first-child { margin-top: 0; }
  .dept-h { color: var(--text); font-size: 11px; font-weight: bold; margin: 7px 0 3px; text-transform: uppercase; }
  .dept-h .cnt { color: var(--dim); font-weight: normal; }
  .h-bar { height: 6px; border-radius: 4px; background: #131d31; margin: 5px 0 12px; overflow: hidden; }
  .h-bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s; }
  .h-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; font-family: "SF Mono", ui-monospace, monospace; }
  .h-top .v { color: var(--accent); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  @media (max-width: 1000px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
    .msg { max-width: 88%; }
  }
</style>
</head>
<body>

<aside>
  <div class="logo">
    <div class="mark">🧠</div>
    <div>
      <div class="t1">Commander OS</div>
      <div class="t2">Agentic Growth Operations</div>
    </div>
  </div>
  <nav>
    <button data-view="chat" class="active">⌘ Command Center</button>
    <button data-view="projects">▤ Projects <span class="n" id="nav-proj-n" style="display:none"></span></button>
    <button data-view="departments">◇ Departments</button>
  </nav>
  <div class="side-h">Agents</div>
  <div id="side-agents"></div>
  <div class="side-foot">
    <button id="killbtn" onclick="toggleKill()">⏻ KILL SWITCH</button>
    <span id="conn" class="mono">connecting…</span>
  </div>
</aside>

<main>

<!-- ============ VIEW: COMMAND CENTER (CHAT) ============ -->
<section class="view active" id="view-chat">
  <h1 class="page">Chat with an Agent</h1>
  <div class="agent-strip" id="agent-strip"></div>

  <div class="chat-wrap">
    <div class="chat-head">
      <div class="ic" id="ch-ic">👑</div>
      <div>
        <div class="nm" id="ch-nm">CEO</div>
        <div class="ch" id="ch-ch">#ceo-channel · Command layer</div>
      </div>
      <div class="right">
        <button id="wake" title="เปิด/ปิด wake word — พูด 'คอมมานเดอร์'">👂</button>
      </div>
    </div>
    <div id="chat-feed"><div class="empty" style="padding:8px">กำลังโหลด…</div></div>
    <div class="chat-input">
      <textarea id="chat-text" rows="1" placeholder="Message CEO… Enter to send. Shift+Enter for a new line."></textarea>
      <button id="orb" title="กดค้างเพื่อพูด">●</button>
      <button id="send-btn" onclick="sendChat()">SEND</button>
    </div>
    <div id="voice-status"></div>
  </div>
</section>

<!-- ============ VIEW: PROJECTS ============ -->
<section class="view" id="view-projects">
  <h1 class="page">Projects — ภารกิจทั้งหมด</h1>
  <div class="stats" id="stats-row"></div>
  <div id="proj-list"><div class="empty">กำลังโหลด…</div></div>
</section>

<!-- ============ VIEW: DEPARTMENTS ============ -->
<section class="view" id="view-departments">
  <h1 class="page">Departments — การทำงานรายแผนก</h1>
  <div class="two-col">
    <div class="panel">
      <h2>📅 Activity รายวัน แยกแผนก</h2>
      <div id="daily-feed"><div class="empty">กำลังโหลด…</div></div>
    </div>
    <div class="panel">
      <h2>🖥 System Health</h2>
      <div class="h-top"><span>CPU</span><span class="v" id="cpu-v">—</span></div>
      <div class="h-bar"><i id="cpu-b" style="width:0%"></i></div>
      <div class="h-top"><span>RAM</span><span class="v" id="ram-v">—</span></div>
      <div class="h-bar"><i id="ram-b" style="width:0%"></i></div>
      <div class="h-top"><span>Disk</span><span class="v" id="disk-v">—</span></div>
      <div class="h-bar"><i id="disk-b" style="width:0%"></i></div>
    </div>
  </div>
</section>

</main>

<script>
let killEngaged = false, curAgent = 'ceo', lastProjects = [], lastSnap = null;
const AGENT_ICON = { ceo: '👑', cmo: '📣', cfo: '💰', researcher: '🔎' };
const AGENT_LAYER = { ceo: 'Command Layer', cmo: 'Market Voice', cfo: 'Finance Ops' };
const AGENT_TH = { ceo: 'CEO — ผู้บริหาร', cmo: 'CMO — การตลาด', cfo: 'CFO — การเงิน' };
const EVENT_TH = {
  plan_created: 'วางแผน/แตกงาน', report_created: 'สรุปรายงาน', analysis_done: 'วิเคราะห์การตลาด',
  finance_analysis_done: 'วิเคราะห์การเงิน', recommendation_approved: 'อนุมัติข้อเสนอ',
  recommendation_rejected: 'ปฏิเสธข้อเสนอ', boardroom_comment: 'อภิปรายในบอร์ด', boardroom_decision: 'มติบอร์ด',
};
const fmt = n => Number(n || 0).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-' + b.dataset.view).classList.add('active');
  if (b.dataset.view === 'projects') loadProjects();
  if (b.dataset.view === 'departments') loadDaily();
}));

// ---------- agent selection ----------
function selectAgent(name) {
  curAgent = name;
  document.getElementById('ch-ic').textContent = AGENT_ICON[name] || '🤖';
  document.getElementById('ch-nm').textContent = name.toUpperCase();
  document.getElementById('ch-ch').textContent = `#${name}-channel · ${AGENT_LAYER[name] || 'Agent'}`;
  document.getElementById('chat-text').placeholder =
    `Message ${name.toUpperCase()}… Enter to send. Shift+Enter for a new line.`;
  if (lastSnap) renderAgents(lastSnap.agents);
  renderChat();
}

function renderAgents(agents) {
  document.getElementById('agent-strip').innerHTML = agents.map(a => `
    <div class="agent-card ${a.name === curAgent ? 'sel' : ''}" onclick="selectAgent('${a.name}')">
      <div class="top">
        <div class="ic">${AGENT_ICON[a.name] || '🤖'}</div>
        <span class="pill p-${a.status}">${a.status.toLowerCase()}</span>
      </div>
      <div class="nm">${a.name.toUpperCase()}</div>
      <div class="rl">${AGENT_LAYER[a.name] || esc(a.role)}</div>
    </div>`).join('');
  document.getElementById('side-agents').innerHTML = agents.map(a => `
    <div class="side-agent ${a.name === curAgent ? 'sel' : ''}" onclick="selectAgent('${a.name}')">
      <div class="ic">${AGENT_ICON[a.name] || '🤖'}</div>
      <div><div class="nm">${a.name.toUpperCase()}</div><div class="rl">${AGENT_LAYER[a.name] || esc(a.role)}</div></div>
      <span class="pill p-${a.status}">${a.status.toLowerCase()}</span>
    </div>`).join('');
}

// ---------- chat feed (from /api/projects, chronological) ----------
function renderChat() {
  const feed = document.getElementById('chat-feed');
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
  const projects = [...lastProjects].sort((a, b) => a.id - b.id);
  const out = [];

  for (const p of projects) {
    const ts = p.created_at ? p.created_at.substring(11, 16) : '';
    if (curAgent === 'ceo') {
      out.push(`<div class="msg me">${esc(p.title)}<span class="ts">#${p.id} ${ts}</span></div>`);
      for (const m of p.boardroom || []) if (m.decision)
        out.push(`<div class="msg bot"><span class="who">⚖️ มติบอร์ด</span>${esc((m.message || '').substring(0, 400))}</div>`);
      if (p.report)
        out.push(`<div class="msg bot"><span class="who">${AGENT_ICON.ceo} CEO</span>${esc(p.report.substring(0, 1200))}${
          p.brief ? `<span class="brief-link" onclick="window.open('/api/deliverables/'+encodeURIComponent('${p.brief}'))">📄 เอกสารสรุปฉบับเต็ม</span>` : ''}</div>`);
      else if (p.status === 'failed')
        out.push(`<div class="msg bot"><span class="who">⚠️ SYSTEM</span>งานนี้ล้มเหลว — สั่งใหม่ได้เลย</div>`);
    } else {
      const evs = (p.departments || {})[curAgent] || [];
      const board = (p.boardroom || []).filter(m => m.speaker === curAgent);
      if (!evs.length && !board.length) continue;
      out.push(`<div class="msg me">${esc(p.title)}<span class="ts">#${p.id} ${ts}</span></div>`);
      for (const e of evs)
        out.push(`<div class="msg bot"><span class="who">${AGENT_ICON[curAgent]} ${EVENT_TH[e.event] || e.event}</span>${esc((e.message || '').substring(0, 500)) || '…'}</div>`);
      for (const m of board)
        out.push(`<div class="msg bot"><span class="who">🏛 ความเห็นในบอร์ด</span>${esc((m.message || '').substring(0, 400))}</div>`);
    }
  }

  // pending approvals surface in the CEO channel as actionable bubbles
  if (curAgent === 'ceo' && lastSnap)
    for (const ap of lastSnap.approvals || [])
      out.push(`<div class="msg bot approval"><span class="who">${AGENT_ICON.ceo} CEO · ขออนุมัติ (ผ่านมติบอร์ดแล้ว)</span>${
        esc(ap.action_type)}: ${esc(ap.payload.action || '')} → ${esc(ap.payload.target || '')}${
        ap.payload.ceo_ruling ? `\n⚖️ ${esc(String(ap.payload.ceo_ruling).substring(0, 200))}` : ''}<div>
        <button class="btn-ok" onclick="decide(${ap.id},'approve')">✅ อนุมัติ</button>
        <button class="btn-no" onclick="decide(${ap.id},'reject')">❌ ปฏิเสธ</button></div></div>`);

  const busy = projects.some(p => ['in_progress', 'pending'].includes(p.status));
  if (busy && curAgent === 'ceo')
    out.push(`<div class="typing">CEO is typing <span class="dots"><i></i><i></i><i></i></span></div>`);

  feed.innerHTML = out.join('') || '<div class="empty" style="padding:8px">ยังไม่มีบทสนทนา — พิมพ์สั่งงานได้เลย</div>';
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
}

async function loadChat() {
  try {
    const j = await (await fetch('/api/projects')).json();
    lastProjects = j.projects;
    renderChat();
    if (document.getElementById('view-projects').classList.contains('active')) renderProjects();
  } catch (e) { /* keep */ }
}
loadChat();
setInterval(loadChat, 8000);

// ---------- live snapshot (WS) ----------
function render(s) {
  lastSnap = s;
  killEngaged = s.kill_switch;
  const kb = document.getElementById('killbtn');
  kb.classList.toggle('engaged', killEngaged);
  kb.textContent = killEngaged ? '⏻ SYSTEM HALTED' : '⏻ KILL SWITCH';

  renderAgents(s.agents);

  const o = s.ops || {}, k = s.kpi || {};
  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="lbl">งานเสร็จวันนี้</div><div class="num n-ok">${k.done_today ?? 0}</div></div>
    <div class="stat"><div class="lbl">รออนุมัติ</div><div class="num ${s.approvals.length ? 'n-warn' : ''}">${s.approvals.length}</div></div>
    <div class="stat"><div class="lbl">ค่า AI วันนี้</div><div class="num">฿${(k.cost_today_thb || 0).toFixed(2)}</div></div>
    <div class="stat"><div class="lbl">ข้อผิดพลาด</div><div class="num ${o.errors ? 'n-err' : 'n-ok'}">${o.errors ?? 0}</div></div>`;

  const nb = document.getElementById('nav-proj-n');
  nb.style.display = s.approvals.length ? '' : 'none';
  nb.textContent = s.approvals.length;

  const h = s.health || {};
  for (const [key, pct] of [['cpu', h.cpu_pct], ['ram', h.ram_pct], ['disk', h.disk_pct]]) {
    document.getElementById(key + '-v').textContent = (pct ?? 0) + '%';
    document.getElementById(key + '-b').style.width = (pct ?? 0) + '%';
  }
  maybeSpeak(s.tasks);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => document.getElementById('conn').textContent = '🟢 live';
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { document.getElementById('conn').textContent = '🔴 reconnecting…'; setTimeout(connect, 3000); };
}
connect();

// ---------- projects view ----------
function renderProjects() {
  document.getElementById('proj-list').innerHTML = lastProjects.length === 0
    ? '<div class="empty">ยังไม่มีภารกิจ</div>'
    : lastProjects.map(p => {
      const col = p.status === 'done' ? 'var(--green)' : p.status === 'failed' ? 'var(--red)'
        : p.status === 'waiting_approval' ? 'var(--amber)' : 'var(--accent)';
      const depts = Object.entries(p.departments).map(([d, evs]) => `
        <div class="dept-block">
          <div class="who">${AGENT_ICON[d] || '🤖'} ${AGENT_TH[d] || d.toUpperCase()}</div>
          ${evs.map(e => `<div class="dept-ev">${e.at ? e.at.substring(11, 16) : ''} <b>${EVENT_TH[e.event] || e.event}</b>${e.message ? ' — ' + esc(e.message.substring(0, 160)) : ''}</div>`).join('')}
        </div>`).join('');
      const board = p.boardroom.map(m => `
        <div class="board-msg ${m.speaker === 'ceo' ? 'is-ceo' : ''}">
          <span class="who">${AGENT_ICON[m.speaker] || '🤖'} ${m.speaker.toUpperCase()}${m.decision ? ' · มติ' : ''}</span>
          <div>${esc((m.message || '').substring(0, 400))}</div>
        </div>`).join('');
      return `
      <div class="proj" id="proj-${p.id}">
        <div class="proj-head" onclick="document.getElementById('proj-${p.id}').classList.toggle('open')">
          <span class="id">#${p.id}</span>
          <span class="title">${esc(p.title)}</span>
          <div class="proj-bar"><i style="width:${p.progress}%;background:${col}"></i></div>
          <span class="proj-status st-${p.status}">${p.status.replace('_', ' ')} · ${p.progress}%</span>
        </div>
        <div class="proj-body">
          ${depts ? `<div class="proj-sec"><h3>🏢 การทำงานของแต่ละแผนก</h3>${depts}</div>` : ''}
          ${board ? `<div class="proj-sec"><h3>🏛 บอร์ดถกกัน → CEO ตัดสิน</h3>${board}</div>` : ''}
          ${p.report ? `<div class="proj-sec"><h3>📊 รายงานถึงคุณ</h3><div class="report-box">${esc(p.report)}</div></div>` : ''}
          ${p.brief ? `<div class="proj-sec"><span class="brief-link" onclick="event.stopPropagation();window.open('/api/deliverables/' + encodeURIComponent('${p.brief}'))">📄 เปิดเอกสารสรุปฉบับเต็ม</span></div>` : ''}
          ${!depts && !board && !p.report ? '<div class="empty">กำลังทำงาน…</div>' : ''}
        </div>
      </div>`;
    }).join('');
}
async function loadProjects() { await loadChat(); renderProjects(); }

// ---------- departments view ----------
async function loadDaily() {
  try {
    const j = await (await fetch('/api/activity/daily?days=7')).json();
    const days = Object.keys(j.days).sort().reverse();
    document.getElementById('daily-feed').innerHTML = days.map(day => `
      <div class="day-h">📅 ${day}</div>` +
      Object.entries(j.days[day]).map(([dept, evs]) => `
        <div class="dept-h">${AGENT_ICON[dept] || '🤖'} ${AGENT_TH[dept] || dept} <span class="cnt">· ${evs.length} กิจกรรม</span></div>` +
        evs.slice(0, 6).map(e => `
          <div class="dept-ev">${e.at ? e.at.substring(11, 16) : ''} <b>${EVENT_TH[e.event] || e.event}</b>${e.summary ? ' — ' + esc(e.summary) : ''}</div>`).join('')
      ).join('')
    ).join('') || '<div class="empty">ยังไม่มีกิจกรรม</div>';
  } catch (e) { /* keep */ }
}
setInterval(() => { if (document.getElementById('view-departments').classList.contains('active')) loadDaily(); }, 30000);

// ---------- command / approvals / kill ----------
const input = document.getElementById('chat-text');
async function sendChat() {
  const text = input.value.trim();
  if (!text) return;
  const payload = curAgent === 'ceo' ? text : `ให้ ${curAgent.toUpperCase()} ทำ: ${text}`;
  const feed = document.getElementById('chat-feed');
  feed.insertAdjacentHTML('beforeend', `<div class="msg me">${esc(text)}<span class="ts">กำลังส่ง…</span></div>`);
  feed.scrollTop = feed.scrollHeight;
  input.value = ''; input.style.height = 'auto';
  try {
    const r = await fetch('/api/command', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: payload, source: 'dashboard'})
    });
    const j = await r.json();
    if (r.ok) { watchTask = j.task_id; loadChat(); }
    else feed.insertAdjacentHTML('beforeend', `<div class="msg bot"><span class="who">⚠️ SYSTEM</span>${esc(JSON.stringify(j))}</div>`);
  } catch (e) {
    feed.insertAdjacentHTML('beforeend', `<div class="msg bot"><span class="who">⚠️ SYSTEM</span>${esc(String(e))}</div>`);
  }
}
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 110) + 'px'; });

async function decide(id, decision) {
  await fetch(`/api/approvals/${id}/decide`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({decision, decided_by: 'owner:dashboard'})
  });
  setTimeout(loadChat, 1200);
}
async function toggleKill() {
  if (!killEngaged && !confirm('หยุดรับคำสั่งใหม่ทั้งหมด?')) return;
  await fetch(`/api/kill-switch?engage=${!killEngaged}`, {method: 'POST'});
}

// ---------- Jarvis: push-to-talk ----------
const orb = document.getElementById('orb');
const vstatus = document.getElementById('voice-status');
let recorder = null, watchTask = null, spokenTasks = new Set();

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      orb.className = 'busy';
      vstatus.textContent = '🧠 กำลังถอดเสียง…';
      const fd = new FormData();
      fd.append('audio', new Blob(chunks, {type: 'audio/webm'}), 'cmd.webm');
      try {
        const r = await fetch('/api/voice/command', {method: 'POST', body: fd});
        const j = await r.json();
        vstatus.textContent = `💬 "${j.transcript}" → Project #${j.task_id}`;
        watchTask = j.task_id;
        loadChat();
      } catch (e) { vstatus.textContent = '⚠️ ' + e; }
      orb.className = '';
    };
    recorder.start();
    orb.className = 'rec';
    vstatus.textContent = '🔴 กำลังฟัง… ปล่อยเพื่อส่ง';
  } catch (e) { vstatus.textContent = '⚠️ เข้าถึงไมค์ไม่ได้: ' + e.message; }
}
function stopRec() { if (recorder && recorder.state === 'recording') recorder.stop(); }
orb.addEventListener('mousedown', startRec);
orb.addEventListener('mouseup', stopRec);
orb.addEventListener('mouseleave', stopRec);
orb.addEventListener('touchstart', e => { e.preventDefault(); startRec(); });
orb.addEventListener('touchend', e => { e.preventDefault(); stopRec(); });

async function maybeSpeak(tasks) {
  if (!watchTask) return;
  const t = (tasks || []).find(x => x.id === watchTask);
  if (!t || t.status !== 'done' || spokenTasks.has(t.id)) return;
  spokenTasks.add(t.id); watchTask = null;
  const r = await fetch(`/api/tasks/${t.id}`);
  const detail = await r.json();
  const report = (detail.result && detail.result.report) || '';
  if (!report) return;
  vstatus.textContent = '🔊 กำลังอ่านรายงาน…';
  const audio = new Audio(`/api/voice/tts?text=${encodeURIComponent(report.substring(0, 600))}`);
  audio.onended = () => vstatus.textContent = '';
  audio.play();
}

// ---------- Wake word ----------
const wakeBtn = document.getElementById('wake');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let wakeOn = false, rec = null;
const WAKE_RE = /(คอมมานเดอร์|คอมมานเด้อ|commander)/i;

function startWake() {
  rec = new SR();
  rec.lang = 'th-TH'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => {
    const said = e.results[e.results.length - 1][0].transcript.trim();
    if (!WAKE_RE.test(said)) return;
    const cmd = said.replace(WAKE_RE, '').replace(/^(เฮ้|เฮ้ย|hey|โอเค|ok)\s*/i, '').trim();
    if (cmd.length < 4) { vstatus.textContent = '👂 ว่าไงครับ? พูดคำสั่งต่อท้าย "คอมมานเดอร์" ได้เลย'; return; }
    vstatus.textContent = `💬 "${cmd}" → ส่งให้ CEO…`;
    fetch('/api/command', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: cmd, source: 'voice'})
    }).then(r => r.json()).then(j => { watchTask = j.task_id; vstatus.textContent = `💬 "${cmd}" → Project #${j.task_id}`; loadChat(); });
  };
  rec.onend = () => { if (wakeOn) rec.start(); };
  rec.onerror = e => { if (e.error === 'not-allowed') { toggleWake(); vstatus.textContent = '⚠️ ไม่ได้รับสิทธิ์ไมค์'; } };
  rec.start();
}
function toggleWake() {
  if (!SR) { vstatus.textContent = '⚠️ เบราว์เซอร์นี้ไม่รองรับ wake word (ใช้ Chrome/Safari)'; return; }
  wakeOn = !wakeOn;
  wakeBtn.classList.toggle('on', wakeOn);
  vstatus.textContent = wakeOn ? '👂 hands-free เปิดอยู่ — พูด "คอมมานเดอร์ + คำสั่ง"' : '';
  if (wakeOn) startWake(); else if (rec) rec.stop();
}
wakeBtn.addEventListener('click', toggleWake);
</script>
