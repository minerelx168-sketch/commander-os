<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Commander OS</title>
<style>
  :root {
    --bg: #05080f; --panel: #0b111d; --panel2: #0e1626; --border: #17233a;
    --text: #d7e1f3; --dim: #5f7191; --accent: #38bdf8; --green: #34d399;
    --amber: #fbbf24; --red: #f87171; --purple: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 13px;
    display: flex;
  }

  /* ============ SIDEBAR ============ */
  aside {
    width: 216px; flex-shrink: 0; position: sticky; top: 0; height: 100vh;
    background: linear-gradient(180deg, #0a1120, #060a12);
    border-right: 1px solid var(--border);
    padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  .logo .mark {
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    background: radial-gradient(circle at 30% 30%, #1e3a5f, #0a0e17);
    border: 1px solid var(--accent); font-size: 16px;
  }
  .logo .t1 { font-weight: bold; font-size: 14px; }
  .logo .t2 { color: var(--dim); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
  nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px;
    border-radius: 8px; color: var(--dim); font-size: 12px; letter-spacing: .5px;
    background: transparent; border: 1px solid transparent; cursor: pointer;
    font-family: inherit; text-align: left;
  }
  nav button:hover { color: var(--text); background: var(--panel2); }
  nav button.active { color: var(--text); background: var(--panel2); border-color: var(--border); }
  nav button .n {
    margin-left: auto; background: rgba(251,191,36,.15); color: var(--amber);
    font-size: 10px; padding: 1px 7px; border-radius: 8px;
  }
  .side-h { margin: 18px 4px 8px; color: var(--dim); font-size: 9px; letter-spacing: 3px; text-transform: uppercase; }
  .side-agent {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; margin-bottom: 6px;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
  }
  .side-agent .ic { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-size: 13px; background: #17233a; }
  .side-agent .nm { font-size: 12px; font-weight: bold; text-transform: uppercase; }
  .side-agent .rl { color: var(--dim); font-size: 9px; }
  .pill { margin-left: auto; font-size: 9px; letter-spacing: 1px; padding: 2px 7px; border-radius: 9px; white-space: nowrap; }
  .p-WORKING { background: rgba(52,211,153,.13); color: var(--green); }
  .p-WAITING { background: rgba(251,191,36,.13); color: var(--amber); }
  .p-IDLE { background: rgba(95,113,145,.13); color: var(--dim); }
  .side-foot { margin-top: auto; padding-top: 14px; }
  #killbtn {
    width: 100%; background: transparent; color: var(--red); border: 1px solid var(--red);
    padding: 8px; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 11px;
  }
  #killbtn.engaged { background: var(--red); color: #000; font-weight: bold; }
  #conn { display: block; text-align: center; color: var(--dim); font-size: 10px; margin-top: 8px; }

  /* ============ MAIN ============ */
  main { flex: 1; min-width: 0; padding: 22px 26px; }
  .view { display: none; }
  .view.active { display: block; }
  h1.page { font-size: 14px; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-bottom: 18px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
  }
  .panel h2 { font-size: 10px; letter-spacing: 2.5px; color: var(--dim); margin-bottom: 12px; text-transform: uppercase; }
  .empty { color: var(--dim); font-style: italic; }

  /* ---- Overview: Jarvis ---- */
  .jarvis { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 26px 16px 20px; }
  #orb {
    width: 96px; height: 96px; border-radius: 50%; cursor: pointer; font-size: 38px;
    border: 3px solid var(--accent); color: var(--accent); transition: all .2s;
    background: radial-gradient(circle at 35% 35%, #1e3a5f, #05080f);
    box-shadow: 0 0 34px rgba(56,189,248,.35), inset 0 0 24px rgba(56,189,248,.15);
    animation: breathe 3.5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { box-shadow: 0 0 50px rgba(56,189,248,.55), inset 0 0 30px rgba(56,189,248,.25); } }
  #orb.rec { border-color: var(--red); color: var(--red); animation: pulse 1s infinite; }
  #orb.busy { border-color: var(--amber); color: var(--amber); animation: pulse 1.4s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .hint { color: var(--dim); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
  #voice-status { color: var(--dim); font-size: 11px; min-height: 15px; text-align: center; }
  .chat-row { display: flex; gap: 8px; width: 100%; max-width: 640px; }
  .chat-row select, .chat-row input {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    font-family: inherit; font-size: 12px; padding: 10px 12px; border-radius: 8px; outline: none;
  }
  .chat-row input { flex: 1; }
  .chat-row input:focus { border-color: var(--accent); }
  .chat-row button {
    background: rgba(56,189,248,.12); color: var(--accent); border: 1px solid var(--accent);
    font-family: inherit; font-size: 12px; padding: 10px 16px; border-radius: 8px; cursor: pointer;
  }
  #wake {
    background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
    border-radius: 8px; padding: 10px 12px; cursor: pointer; font-size: 13px;
  }
  #wake.on { border-color: var(--green); color: var(--green); }
  #chat-status { color: var(--dim); font-size: 11px; margin-top: 6px; min-height: 14px; text-align: center; }

  /* ---- Overview: stats + biz ---- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .stat .lbl { color: var(--dim); font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
  .stat .num { font-size: 22px; margin-top: 5px; }
  .stat .sub { color: var(--dim); font-size: 10px; margin-top: 3px; }
  .n-ok { color: var(--green); } .n-warn { color: var(--amber); } .n-err { color: var(--red); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .biz-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed #16203380; font-size: 12px; }
  .biz-row .v { color: var(--text); } .biz-row .k { color: var(--dim); }
  .h-bar { height: 6px; border-radius: 4px; background: #131d31; margin: 5px 0 12px; overflow: hidden; }
  .h-bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .6s; }
  .h-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
  .h-top .v { color: var(--accent); }

  /* ---- Approvals ---- */
  .approval-item {
    background: var(--panel2); border: 1px solid var(--border); border-left: 3px solid var(--amber);
    border-radius: 8px; padding: 12px; margin-bottom: 8px;
  }
  .approval-item .meta { color: var(--dim); font-size: 11px; margin-bottom: 6px; }
  .approval-item .ruling { color: var(--purple); font-size: 11px; margin-top: 6px; }
  .approval-item button {
    font-family: inherit; font-size: 11px; padding: 5px 14px; border-radius: 6px;
    cursor: pointer; margin-right: 6px; border: 1px solid; background: transparent; margin-top: 8px;
  }
  .btn-ok { color: var(--green); border-color: var(--green); }
  .btn-no { color: var(--red); border-color: var(--red); }

  /* ---- Projects ---- */
  .proj {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .proj-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; cursor: pointer; }
  .proj-head:hover { background: var(--panel2); }
  .proj-head .id { color: var(--dim); font-size: 11px; }
  .proj-head .title { flex: 1; font-size: 13px; }
  .proj-bar { width: 130px; height: 7px; border-radius: 4px; background: #131d31; overflow: hidden; }
  .proj-bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s; }
  .st-done { color: var(--green); } .st-waiting_approval { color: var(--amber); }
  .st-in_progress { color: var(--accent); } .st-failed { color: var(--red); } .st-pending { color: var(--dim); }
  .proj-status { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; width: 110px; text-align: right; }
  .proj-body { display: none; border-top: 1px solid var(--border); padding: 16px 18px; }
  .proj.open .proj-body { display: block; }
  .proj-sec { margin-bottom: 14px; }
  .proj-sec h3 { font-size: 10px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-bottom: 8px; }
  .dept-block { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .dept-block .who { font-size: 11px; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
  .dept-ev { color: var(--dim); font-size: 11px; padding: 2px 0 2px 12px; border-left: 1px dashed var(--border); margin-left: 3px; }
  .dept-ev b { color: var(--text); font-weight: normal; }
  .board-msg {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; margin-bottom: 7px; font-size: 12px;
  }
  .board-msg .who { color: var(--accent); font-size: 10px; letter-spacing: 1px; display: block; margin-bottom: 4px; }
  .board-msg.is-ceo { border-left: 3px solid var(--purple); }
  .board-msg.is-ceo .who { color: var(--purple); }
  .report-box {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 12px; white-space: pre-wrap; line-height: 1.55;
    max-height: 300px; overflow-y: auto;
  }
  .brief-link { color: var(--accent); font-size: 11px; cursor: pointer; text-decoration: underline; }

  /* ---- Departments view ---- */
  .day-h { color: var(--accent); font-size: 11px; letter-spacing: 2px; margin: 12px 0 6px; text-transform: uppercase; }
  .day-h:first-child { margin-top: 0; }
  .dept-h { color: var(--text); font-size: 11px; font-weight: bold; margin: 7px 0 3px; text-transform: uppercase; }
  .dept-h .cnt { color: var(--dim); font-weight: normal; }

  @media (max-width: 1000px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<aside>
  <div class="logo">
    <div class="mark">🧠</div>
    <div>
      <div class="t1">Commander OS</div>
      <div class="t2">Agentic Growth Ops</div>
    </div>
  </div>
  <nav>
    <button data-view="overview" class="active">◈ Overview</button>
    <button data-view="projects">▤ Projects <span class="n" id="nav-proj-n" style="display:none"></span></button>
    <button data-view="departments">◇ Departments</button>
  </nav>
  <div class="side-h">Agents</div>
  <div id="side-agents"></div>
  <div class="side-foot">
    <button id="killbtn" onclick="toggleKill()">⏻ KILL SWITCH</button>
    <span id="conn">connecting…</span>
  </div>
</aside>

<main>

<!-- ============ VIEW: OVERVIEW ============ -->
<section class="view active" id="view-overview">
  <h1 class="page">Overview</h1>

  <div class="panel">
    <div class="jarvis">
      <button id="orb" title="กดค้างเพื่อพูด">🎙</button>
      <div class="hint">Jarvis — กดค้างเพื่อพูด หรือพิมพ์สั่งงาน</div>
      <span id="voice-status"></span>
      <div class="chat-row">
        <select id="chat-agent"><option value="ceo">CEO</option></select>
        <input id="chat-text" placeholder="พิมพ์คำสั่ง… (Enter เพื่อส่ง)" />
        <button onclick="sendChat()">ส่ง ➤</button>
        <button id="wake" title="เปิด/ปิด wake word — พูด 'คอมมานเดอร์'">👂</button>
      </div>
      <div id="chat-status"></div>
    </div>
  </div>

  <div class="stats" id="stats-row"></div>

  <div class="two-col">
    <div class="panel">
      <h2>💼 ภาพรวมธุรกิจ</h2>
      <div id="biz-list"></div>
    </div>
    <div>
      <div class="panel">
        <h2>📋 รออนุมัติจากคุณ</h2>
        <div id="approval-list"></div>
      </div>
      <div class="panel">
        <h2>🖥 System Health</h2>
        <div class="h-top"><span>CPU</span><span class="v" id="cpu-v">—</span></div>
        <div class="h-bar"><i id="cpu-b" style="width:0%"></i></div>
        <div class="h-top"><span>RAM</span><span class="v" id="ram-v">—</span></div>
        <div class="h-bar"><i id="ram-b" style="width:0%"></i></div>
        <div class="h-top"><span>Disk</span><span class="v" id="disk-v">—</span></div>
        <div class="h-bar"><i id="disk-b" style="width:0%"></i></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ VIEW: PROJECTS ============ -->
<section class="view" id="view-projects">
  <h1 class="page">Projects — ภารกิจทั้งหมด</h1>
  <div id="proj-list"><div class="empty">กำลังโหลด…</div></div>
</section>

<!-- ============ VIEW: DEPARTMENTS ============ -->
<section class="view" id="view-departments">
  <h1 class="page">Departments — การทำงานรายแผนก</h1>
  <div class="panel">
    <h2>📅 Activity รายวัน แยกแผนก</h2>
    <div id="daily-feed"><div class="empty">กำลังโหลด…</div></div>
  </div>
</section>

</main>

<script>
let killEngaged = false;
const AGENT_ICON = { ceo: '👑', cmo: '📣', cfo: '💰', researcher: '🔎' };
const AGENT_TH = { ceo: 'CEO — ผู้บริหาร', cmo: 'CMO — การตลาด', cfo: 'CFO — การเงิน' };
const EVENT_TH = {
  plan_created: 'วางแผน/แตกงาน', report_created: 'สรุปรายงาน', analysis_done: 'วิเคราะห์การตลาด',
  finance_analysis_done: 'วิเคราะห์การเงิน', recommendation_approved: 'อนุมัติข้อเสนอ',
  recommendation_rejected: 'ปฏิเสธข้อเสนอ', boardroom_comment: 'อภิปรายในบอร์ด', boardroom_decision: 'มติบอร์ด',
};
const fmt = n => Number(n || 0).toLocaleString('en-US');

// ---------- tabs ----------
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('view-' + b.dataset.view).classList.add('active');
  if (b.dataset.view === 'projects') loadProjects();
  if (b.dataset.view === 'departments') loadDaily();
}));

// ---------- live snapshot (WS) ----------
function render(s) {
  killEngaged = s.kill_switch;
  const kb = document.getElementById('killbtn');
  kb.classList.toggle('engaged', killEngaged);
  kb.textContent = killEngaged ? '⏻ SYSTEM HALTED' : '⏻ KILL SWITCH';

  document.getElementById('side-agents').innerHTML = s.agents.map(a => `
    <div class="side-agent">
      <div class="ic">${AGENT_ICON[a.name] || '🤖'}</div>
      <div><div class="nm">${a.name}</div><div class="rl">${a.role}</div></div>
      <span class="pill p-${a.status}">${a.status.toLowerCase()}</span>
    </div>`).join('');

  const sel = document.getElementById('chat-agent');
  const cur = sel.value;
  sel.innerHTML = s.agents.map(a => `<option value="${a.name}">${a.name.toUpperCase()}</option>`).join('');
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;

  const o = s.ops || {}, k = s.kpi || {};
  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="lbl">งานเสร็จวันนี้</div><div class="num n-ok">${k.done_today ?? 0}</div></div>
    <div class="stat"><div class="lbl">รออนุมัติ</div><div class="num ${s.approvals.length ? 'n-warn' : ''}">${s.approvals.length}</div></div>
    <div class="stat"><div class="lbl">ค่า AI วันนี้</div><div class="num">฿${(k.cost_today_thb || 0).toFixed(2)}</div></div>
    <div class="stat"><div class="lbl">ข้อผิดพลาด</div><div class="num ${o.errors ? 'n-err' : 'n-ok'}">${o.errors ?? 0}</div></div>`;

  document.getElementById('biz-list').innerHTML = `
    <div class="biz-row"><span class="k">คำสั่งล่าสุด</span><span class="v">${s.directive ? s.directive.title.substring(0, 42) : '—'}</span></div>
    <div class="biz-row"><span class="k">สถานะ</span><span class="v st-${s.directive?.status || ''}">${s.directive?.status || '—'}</span></div>
    <div class="biz-row"><span class="k">Agent Calls สะสม</span><span class="v">${fmt(o.agent_calls)}</span></div>
    <div class="biz-row"><span class="k">Tokens (in / out)</span><span class="v">${fmt(o.tokens_in)} / ${fmt(o.tokens_out)}</span></div>
    <div class="biz-row"><span class="k">ความสำเร็จของงาน</span><span class="v n-ok">${o.integrity_pct ?? 100}%</span></div>`;

  document.getElementById('approval-list').innerHTML = s.approvals.length === 0
    ? '<div class="empty">ไม่มี — แผนกถกกันและ CEO กลั่นกรองให้ก่อนแล้ว</div>'
    : s.approvals.map(ap => `
      <div class="approval-item">
        <div class="meta">#${ap.id} · ผ่านมติบอร์ดแล้ว · risk: ${ap.risk}</div>
        <div>${ap.action_type}: ${ap.payload.action || ''} → ${ap.payload.target || ''}</div>
        ${ap.payload.ceo_ruling ? `<div class="ruling">⚖️ CEO: ${String(ap.payload.ceo_ruling).substring(0, 160)}</div>` : ''}
        <div>
          <button class="btn-ok" onclick="decide(${ap.id}, 'approve')">✅ อนุมัติ</button>
          <button class="btn-no" onclick="decide(${ap.id}, 'reject')">❌ ปฏิเสธ</button>
        </div>
      </div>`).join('');
  const nb = document.getElementById('nav-proj-n');
  nb.style.display = s.approvals.length ? '' : 'none';
  nb.textContent = s.approvals.length;

  const h = s.health || {};
  for (const [key, pct] of [['cpu', h.cpu_pct], ['ram', h.ram_pct], ['disk', h.disk_pct]]) {
    document.getElementById(key + '-v').textContent = (pct ?? 0) + '%';
    document.getElementById(key + '-b').style.width = (pct ?? 0) + '%';
  }
  maybeSpeak(s.tasks);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  ws.onopen = () => document.getElementById('conn').textContent = '🟢 live';
  ws.onmessage = e => render(JSON.parse(e.data));
  ws.onclose = () => { document.getElementById('conn').textContent = '🔴 reconnecting…'; setTimeout(connect, 3000); };
}
connect();

// ---------- projects view ----------
async function loadProjects() {
  try {
    const j = await (await fetch('/api/projects')).json();
    document.getElementById('proj-list').innerHTML = j.projects.length === 0
      ? '<div class="empty">ยังไม่มีภารกิจ</div>'
      : j.projects.map(p => {
        const col = p.status === 'done' ? 'var(--green)' : p.status === 'failed' ? 'var(--red)'
          : p.status === 'waiting_approval' ? 'var(--amber)' : 'var(--accent)';
        const depts = Object.entries(p.departments).map(([d, evs]) => `
          <div class="dept-block">
            <div class="who">${AGENT_ICON[d] || '🤖'} ${AGENT_TH[d] || d.toUpperCase()}</div>
            ${evs.map(e => `<div class="dept-ev">${e.at ? e.at.substring(11, 16) : ''} <b>${EVENT_TH[e.event] || e.event}</b>${e.message ? ' — ' + e.message.substring(0, 160) : ''}</div>`).join('')}
          </div>`).join('');
        const board = p.boardroom.map(m => `
          <div class="board-msg ${m.speaker === 'ceo' ? 'is-ceo' : ''}">
            <span class="who">${AGENT_ICON[m.speaker] || '🤖'} ${m.speaker.toUpperCase()}${m.decision ? ' · มติ' : ''}</span>
            <div>${(m.message || '').substring(0, 400)}</div>
          </div>`).join('');
        return `
        <div class="proj" id="proj-${p.id}">
          <div class="proj-head" onclick="document.getElementById('proj-${p.id}').classList.toggle('open')">
            <span class="id">#${p.id}</span>
            <span class="title">${p.title}</span>
            <div class="proj-bar"><i style="width:${p.progress}%;background:${col}"></i></div>
            <span class="proj-status st-${p.status}">${p.status.replace('_', ' ')} · ${p.progress}%</span>
          </div>
          <div class="proj-body">
            ${depts ? `<div class="proj-sec"><h3>🏢 การทำงานของแต่ละแผนก</h3>${depts}</div>` : ''}
            ${board ? `<div class="proj-sec"><h3>🏛 บอร์ดถกกัน → CEO ตัดสิน</h3>${board}</div>` : ''}
            ${p.report ? `<div class="proj-sec"><h3>📊 รายงานถึงคุณ</h3><div class="report-box">${p.report}</div></div>` : ''}
            ${p.brief ? `<div class="proj-sec"><span class="brief-link" onclick="event.stopPropagation();window.open('/api/deliverables/' + encodeURIComponent('${p.brief}'))">📄 เปิดเอกสารสรุปฉบับเต็ม</span></div>` : ''}
            ${!depts && !board && !p.report ? '<div class="empty">กำลังทำงาน…</div>' : ''}
          </div>
        </div>`;
      }).join('');
  } catch (e) { /* keep */ }
}
setInterval(() => { if (document.getElementById('view-projects').classList.contains('active')) loadProjects(); }, 15000);

// ---------- departments view ----------
async function loadDaily() {
  try {
    const j = await (await fetch('/api/activity/daily?days=7')).json();
    const days = Object.keys(j.days).sort().reverse();
    document.getElementById('daily-feed').innerHTML = days.map(day => `
      <div class="day-h">📅 ${day}</div>` +
      Object.entries(j.days[day]).map(([dept, evs]) => `
        <div class="dept-h">${AGENT_ICON[dept] || '🤖'} ${AGENT_TH[dept] || dept} <span class="cnt">· ${evs.length} กิจกรรม</span></div>` +
        evs.slice(0, 6).map(e => `
          <div class="dept-ev">${e.at ? e.at.substring(11, 16) : ''} <b>${EVENT_TH[e.event] || e.event}</b>${e.summary ? ' — ' + e.summary : ''}</div>`).join('')
      ).join('')
    ).join('') || '<div class="empty">ยังไม่มีกิจกรรม</div>';
  } catch (e) { /* keep */ }
}
setInterval(() => { if (document.getElementById('view-departments').classList.contains('active')) loadDaily(); }, 30000);

// ---------- command / approvals / kill ----------
async function sendChat() {
  const input = document.getElementById('chat-text');
  const agent = document.getElementById('chat-agent').value;
  const text = input.value.trim();
  if (!text) return;
  const payload = agent === 'ceo' ? text : `ให้ ${agent.toUpperCase()} ทำ: ${text}`;
  const st = document.getElementById('chat-status');
  st.textContent = '⏳ ส่งคำสั่ง…';
  try {
    const r = await fetch('/api/command', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: payload, source: 'dashboard'})
    });
    const j = await r.json();
    st.textContent = r.ok ? `✅ Project #${j.task_id} เริ่มแล้ว — ดูความคืบหน้าในแท็บ Projects` : `⚠️ ${JSON.stringify(j)}`;
    if (r.ok) { watchTask = j.task_id; input.value = ''; }
  } catch (e) { st.textContent = '⚠️ ' + e; }
}
document.getElementById('chat-text').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

async function decide(id, decision) {
  await fetch(`/api/approvals/${id}/decide`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({decision, decided_by: 'owner:dashboard'})
  });
}
async function toggleKill() {
  if (!killEngaged && !confirm('หยุดรับคำสั่งใหม่ทั้งหมด?')) return;
  await fetch(`/api/kill-switch?engage=${!killEngaged}`, {method: 'POST'});
}

// ---------- Jarvis: push-to-talk ----------
const orb = document.getElementById('orb');
const vstatus = document.getElementById('voice-status');
let recorder = null, watchTask = null, spokenTasks = new Set();

async function startRec() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    recorder = new MediaRecorder(stream, {mimeType: 'audio/webm'});
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      orb.className = 'busy';
      vstatus.textContent = '🧠 กำลังถอดเสียง…';
      const fd = new FormData();
      fd.append('audio', new Blob(chunks, {type: 'audio/webm'}), 'cmd.webm');
      try {
        const r = await fetch('/api/voice/command', {method: 'POST', body: fd});
        const j = await r.json();
        vstatus.textContent = `💬 "${j.transcript}" → Project #${j.task_id}`;
        watchTask = j.task_id;
      } catch (e) { vstatus.textContent = '⚠️ ' + e; }
      orb.className = '';
    };
    recorder.start();
    orb.className = 'rec';
    vstatus.textContent = '🔴 กำลังฟัง… ปล่อยเพื่อส่ง';
  } catch (e) { vstatus.textContent = '⚠️ เข้าถึงไมค์ไม่ได้: ' + e.message; }
}
function stopRec() { if (recorder && recorder.state === 'recording') recorder.stop(); }
orb.addEventListener('mousedown', startRec);
orb.addEventListener('mouseup', stopRec);
orb.addEventListener('mouseleave', stopRec);
orb.addEventListener('touchstart', e => { e.preventDefault(); startRec(); });
orb.addEventListener('touchend', e => { e.preventDefault(); stopRec(); });

async function maybeSpeak(tasks) {
  if (!watchTask) return;
  const t = (tasks || []).find(x => x.id === watchTask);
  if (!t || t.status !== 'done' || spokenTasks.has(t.id)) return;
  spokenTasks.add(t.id); watchTask = null;
  const r = await fetch(`/api/tasks/${t.id}`);
  const detail = await r.json();
  const report = (detail.result && detail.result.report) || '';
  if (!report) return;
  vstatus.textContent = '🔊 กำลังอ่านรายงาน…';
  const audio = new Audio(`/api/voice/tts?text=${encodeURIComponent(report.substring(0, 600))}`);
  audio.onended = () => vstatus.textContent = '';
  audio.play();
}

// ---------- Wake word ----------
const wakeBtn = document.getElementById('wake');
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let wakeOn = false, rec = null;
const WAKE_RE = /(คอมมานเดอร์|คอมมานเด้อ|commander)/i;

function startWake() {
  rec = new SR();
  rec.lang = 'th-TH'; rec.continuous = true; rec.interimResults = false;
  rec.onresult = e => {
    const said = e.results[e.results.length - 1][0].transcript.trim();
    if (!WAKE_RE.test(said)) return;
    const cmd = said.replace(WAKE_RE, '').replace(/^(เฮ้|เฮ้ย|hey|โอเค|ok)\s*/i, '').trim();
    if (cmd.length < 4) { vstatus.textContent = '👂 ว่าไงครับ? พูดคำสั่งต่อท้าย "คอมมานเดอร์" ได้เลย'; return; }
    vstatus.textContent = `💬 "${cmd}" → ส่งให้ CEO…`;
    fetch('/api/command', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: cmd, source: 'voice'})
    }).then(r => r.json()).then(j => { watchTask = j.task_id; vstatus.textContent = `💬 "${cmd}" → Project #${j.task_id}`; });
  };
  rec.onend = () => { if (wakeOn) rec.start(); };
  rec.onerror = e => { if (e.error === 'not-allowed') { toggleWake(); vstatus.textContent = '⚠️ ไม่ได้รับสิทธิ์ไมค์'; } };
  rec.start();
}
function toggleWake() {
  if (!SR) { vstatus.textContent = '⚠️ เบราว์เซอร์นี้ไม่รองรับ wake word (ใช้ Chrome/Safari)'; return; }
  wakeOn = !wakeOn;
  wakeBtn.classList.toggle('on', wakeOn);
  vstatus.textContent = wakeOn ? '👂 hands-free เปิดอยู่ — พูด "คอมมานเดอร์ + คำสั่ง"' : '';
  if (wakeOn) startWake(); else if (rec) rec.stop();
}
wakeBtn.addEventListener('click', toggleWake);
</script>
